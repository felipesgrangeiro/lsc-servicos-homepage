name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lsc-production
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            app
            package.json
            package-lock.json
            next.config.ts
            tsconfig.json
            postcss.config.mjs
            next-env.d.ts
            eslint.config.mjs
            server.js
          retention-days: 3

  deploy:
    name: Deploy via SSH (cPanel)
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      NODEVENV_ACTIVATE: ${{ secrets.NODEVENV_ACTIVATE }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: deploy

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY inválida. Cole a chave privada completa (BEGIN/END OPENSSH PRIVATE KEY)."
            exit 1
          fi
          echo "SSH key OK — fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          echo "Connecting to ${SSH_HOST} on port ${PORT}..."
          if ! nc -z -w 15 "$SSH_HOST" "$PORT"; then
            echo "::error::SSH port ${PORT} is unreachable from GitHub Actions."
            echo "Peça ao admin para liberar a porta ${PORT} para IPs do GitHub Actions."
            exit 1
          fi
          ssh-keyscan -p "$PORT" -T 15 "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to cPanel
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_PATH}' && mkdir -p '${DEPLOY_PATH}/tmp'"
          tar -C ./deploy \
            --exclude 'node_modules' \
            --exclude 'tmp' \
            --exclude '.git' \
            -czf - . \
          | ssh "${SSH_OPTS[@]}" \
              "${SSH_USER}@${SSH_HOST}" \
              "tar -xzf - -C '${DEPLOY_PATH}'"

      - name: Install production deps and restart
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' NODEVENV_ACTIVATE='${NODEVENV_ACTIVATE}' bash -s" << 'EOF'
            set -euo pipefail
            if [ -n "${NODEVENV_ACTIVATE:-}" ] && [ -f "$NODEVENV_ACTIVATE" ]; then
              # shellcheck disable=SC1090
              source "$NODEVENV_ACTIVATE"
            fi
            cd "$DEPLOY_PATH"
            npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deploy finished at $(date) — path: $DEPLOY_PATH"
            node -v
            npm -v
          EOF
